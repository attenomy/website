  <style>
    :root {
      --bg-color: #000000;
      --text-color: #ffffff;
      --accent-color: #ED2939;
      --secondary-color: #666666;
      --card-bg: rgba(255, 255, 255, 0.05);
      --border-color: rgba(255, 255, 255, 0.1);
    }

    [data-theme="light"] {
      --bg-color: #ffffff;
      --text-color: #000000;
      --accent-color: #ED2939;
      --secondary-color: #666666;
      --card-bg: rgba(0, 0, 0, 0.03);
      --border-color: rgba(0, 0, 0, 0.1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Open Sans', fangsong;
      transition: background-color 0.3s ease, color 0.3s ease;
      padding: 20px;
    }

    .container {
      text-align: center;
      max-width: 600px;
      width: 100%;
    }

    .title {
      font-size: 3rem;
      font-weight: 1600;
      margin-bottom: 20px;
      background: linear-gradient(90deg, var(--text-color), var(--accent-color), var(--text-color));
      background-size: 200% auto;
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shine 2s linear infinite;
      opacity: 0;
      animation: fadeIn 0.4s ease forwards 0.2s, shine 2s linear infinite 1s;
    }

    .subtitle {
      font-size: 1.5rem;
      margin-bottom: 40px;
      color: var(--secondary-color);
      opacity: 0;
      animation: fadeIn 0.4s ease forwards 0.3s;
    }

    .description {
      margin-bottom: 40px;
      line-height: 1.6;
      color: var(--secondary-color);
      opacity: 0;
      animation: fadeIn 0.4s ease forwards 0.5s;
    }

    .social-links {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 40px;
      opacity: 0;
      animation: fadeIn 0.4s ease forwards 0.7s;
    }

    .social-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border-radius: 25%;
      background: var(--card-bg);
      color: var(--text-color);
      text-decoration: none;
      transition: all 0.3s ease;
      border: 1px solid var(--border-color);
    }

    .social-link:hover {
      background: var(--accent-color);
      transform: translateY(-2px);
    }

    .theme-toggle {
      position: absolute;
      top: 20px;
      right: 20px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 25%;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .theme-toggle:hover {
      background: var(--accent-color);
    }

    @keyframes shine {
      to {
        background-position: 200% center;
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

  <script>
    // Theme detection and toggle
    const themeToggle = document.getElementById('themeToggle');
    const prefersDarkScheme = window.matchMedia('(prefers-color-scheme: dark)');

    // Set initial theme based on browser preference
    if (prefersDarkScheme.matches) {
      document.body.setAttribute('data-theme', 'dark');
    } else {
      document.body.setAttribute('data-theme', 'light');
    }

    // Toggle theme on button click
    themeToggle.addEventListener('click', () => {
      const currentTheme = document.body.getAttribute('data-theme');
      document.body.setAttribute('data-theme', currentTheme === 'light' ? 'dark' : 'light');
    });

  </script>
